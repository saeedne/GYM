{% extends "base.html" %}
{% block title %}ورود{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <h1>ورود به Gym Manager</h1>
        <p class="muted">ورود به سامانه مدیریت باشگاه‌ها</p>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label>نام کاربری</label>
            {{ form.username }}
            <label>رمز عبور</label>
            {{ form.password }}
            <button class="btn primary" type="submit">ورود</button>
        </form>
    </div>
</div>
{% endblock %}
