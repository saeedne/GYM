{% extends "base.html" %}
{% block title %}حذف عضو{% endblock %}
{% block content %}
<div class="panel">
    <h2>حذف عضو</h2>
    <p>آیا از حذف «{{ member.full_name }}» از باشگاه «{{ club.name }}» مطمئن هستید؟</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn danger" type="submit">بله، حذف شود</button>
        <a class="btn" href="{% url 'member_detail' member.pk %}">انصراف</a>
    </form>
</div>
{% endblock %}
