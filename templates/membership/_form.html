{% csrf_token %}
{% for field in form %}
<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
</div>
{% endfor %}
{% for error in form.non_field_errors %}<p class="error">{{ error }}</p>{% endfor %}
<button class="btn primary" type="submit">ذخیره</button>
