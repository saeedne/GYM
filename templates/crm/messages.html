{% extends 'base.html' %}{% block content %}<h1>صف پیام‌ها</h1><div class="panel"><table><tr><th>گیرنده</th><th>کانال</th><th>وضعیت</th><th>پیام</th><th>زمان</th></tr>{% for item in items %}<tr><td>{{ item.recipient }}</td><td>{{ item.get_channel_display }}</td><td>{{ item.get_status_display }}</td><td>{{ item.body|truncatechars:90 }}</td><td>{{ item.created_at }}</td></tr>{% empty %}<tr><td colspan="5">پیامی در صف نیست.</td></tr>{% endfor %}</table></div>{% endblock %}
